<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#aaaaaa">
  <meta name="robots" content="noindex">
  <title>Level Data — Nv2 Leaderboards</title>
  <link rel="stylesheet" href="/nv2-metanet-records/styles.css?v=20261109-gray-copy">
  <link rel="stylesheet" href="/level-data.css?v=20261124">
  <script src="/level-data-config.js?v=20261124" defer></script>
  <script src="/level-data.js?v=20261124" defer></script>
</head>
<body data-page="level-data">
  <div class="page-shell">
    <header class="site-header">
      <h1 class="site-title"><a href="/home" aria-label="Nv2 Leaderboards home">Nv2 Leaderboards</a></h1>
    </header>
    <main class="level-data-lookup">
      <h2>Level Data</h2>
      <form id="level-data-form" class="player-search level-data-form">
        <label class="visually-hidden" for="level-id-input">6-digit level number</label>
        <div class="player-search-box">
          <input id="level-id-input" name="level" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="6-digit level number" autocomplete="off" spellcheck="false" required aria-describedby="level-lookup-status">
          <button id="level-data-enter" type="submit">Enter</button>
        </div>
        <p id="level-lookup-status" class="player-search-status" role="status" aria-live="polite"></p>
      </form>
      <section id="level-data-result" class="level-data-section level-data-result" aria-labelledby="level-data-heading" hidden>
        <div class="level-data-header">
          <h3 id="level-data-heading">Level data</h3>
          <button id="copy-level-data" class="copy-level-data" type="button" aria-label="Copy level data" title="Copy level data" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V4H4v12h4"/></svg>
          </button>
        </div>
        <textarea id="level-data-text" class="level-data-text" aria-label="Level data" readonly wrap="off" spellcheck="false" rows="2"></textarea>
        <span id="level-copy-status" class="level-data-status" role="status" aria-live="polite"></span>
      </section>
      <noscript>Enable JavaScript to look up level data.</noscript>
    </main>
  </div>
</body>
</html>
